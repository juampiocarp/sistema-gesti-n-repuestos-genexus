<text x="185" y="330" text-anchor="middle" font-family="Arial" font-size="29" font-weight="700" fill="#1e3a8a">Vendedor</text>
<g font-family="Arial" font-size="19" fill="#0f172a">
<text x="360" y="190">1. Actualizar catálogo de proveedores</text>
<text x="360" y="232">2. Actualizar clientes</text>
<text x="360" y="274">3. Agregar imagen del producto al stock</text>
<text x="360" y="316">4. Registrar pedido a proveedor</text>
<text x="360" y="358">7. Buscar productos por código, nombre o palabra clave</text>
<text x="360" y="400">8. Registrar pedidos de clientes</text>
<text x="360" y="442">9. Registrar ventas</text>
</g>
<rect x="55" y="550" width="1290" height="490" rx="22" fill="#fff" stroke="#a5b4fc" stroke-width="2"/>
