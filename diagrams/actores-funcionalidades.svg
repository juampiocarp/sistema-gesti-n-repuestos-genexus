<text x="395" y="950">listado de cajas y productos actualizados</text>
</g>
<text x="700" y="1090" text-anchor="middle" font-family="Arial" font-size="14" fill="#64748b">Transcripción visual resumida; consultar el archivo fuente y el trabajo académico para el detalle completo.</text>
